<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Slides — charte starter</title>
  <link rel="stylesheet" href="starter.css">
</head>
<body class="slides">
  <section class="slide">
    <img src="logo.svg" alt="logo" width="160" height="48">
    <h1>Titre de la présentation</h1>
    <p class="sub">Auteur · date</p>
  </section>

  <section class="slide">
    <p class="section-label">Idée 1</p>
    <h2>Un message par écran</h2>
    <p>Le contenu prime ; la charte reste discrète.</p>
  </section>

  <section class="slide">
    <p class="section-label">Idée 2</p>
    <h2>Points clés</h2>
    <ul>
      <li>Premier point</li>
      <li>Deuxième point</li>
      <li>Troisième point</li>
    </ul>
  </section>

  <section class="slide">
    <h2>Merci</h2>
    <p class="sub">Questions ?</p>
  </section>
</body>
</html>
