<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none" role="img" aria-label="NaonEdge — grue">
  <title>NaonEdge — grue (Nantes / ingénierie)</title>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="48" y2="48">
      <stop offset="0" stop-color="#c8a44e"/><stop offset="1" stop-color="#e8c960"/>
    </linearGradient>
    <linearGradient id="yel" x1="10" y1="12" x2="40" y2="38">
      <stop offset="0" stop-color="#f4c430"/><stop offset="1" stop-color="#e8b21f"/>
    </linearGradient>
  </defs>
  <!-- badge -->
  <rect x="2.5" y="2.5" width="43" height="43" rx="12" fill="#0e0d0a" stroke="url(#gold)" stroke-width="2"/>
  <!-- grue jaune (réf. grue Titan de Nantes) -->
  <g stroke="url(#yel)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- flèche horizontale (jib) -->
    <path d="M11 16 H39"/>
    <!-- pylône en A -->
    <path d="M20 16 L14 38 M20 16 L26 38"/>
    <!-- entretoise -->
    <path d="M16.5 28 H23.5"/>
    <!-- mât / poulie sommet -->
    <path d="M20 16 V12.5"/>
  </g>
  <circle cx="20" cy="11.4" r="1.5" fill="#f4c430"/>
  <!-- contrepoids -->
  <rect x="9.5" y="13.6" width="4" height="4.8" rx="1" fill="#f4c430"/>
  <!-- câble + crochet -->
  <path d="M34 16 V25" stroke="#e8c960" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M34 25 a2 2 0 1 0 1.6 -0.4" stroke="#f4c430" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <!-- sol -->
  <path d="M12 38 H28" stroke="url(#yel)" stroke-width="2.2" stroke-linecap="round"/>
</svg>
