name: release

# Publie l'artefact installable de la CLI sur la release du tag pousse.
# La CLI est en Node pur (zero dependance runtime) : son artefact est le
# tarball npm, installable par `npm install -g <fichier>.tgz` sur les trois OS.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag de version a publier (ex. v0.20.4)'
        required: true

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      # AR-4(a) (2026-09-08) — EPINGLE au SHA de 40 caracteres (lu + verifie contre un tag annote
      # eventuel via `gh api repos/<action>/git/ref/tags/<tag>` : les trois objets rendus sont de
      # type `commit`, aucune dereference necessaire). Solde CI-RELEASE-AUCUN-EPINGLAGE
      # (BACKLOG.md). Cliquet : cli/fixtures/actions-pin.json (SHA + sha256 de l'action.yml +
      # entrees declarees). Contrefactuel : cli/test/release-latest-shell.test.js (CA-L6).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Verifier que la CLI demarre
        working-directory: cli
        run: node src/index.js --help

      - name: Produire le tarball npm
        working-directory: cli
        run: npm pack --pack-destination ..

      # ┌─ L42 -> L44 — LE `latest` CESSE D'ETRE SUBI ────────────────────────────────────────────┐
      # │ L44 — CE QUE CE WORKFLOW FAIT DU `latest`, MESURE, AU 2026-09-01. Rectifie une          │
      # │ seconde fois : ce cartouche a dit « republier un tag ANCIEN VOLE donc le latest »       │
      # │ et « reecrit a chaque creation OU MISE A JOUR ». Faux (L43, R-1). On date, on           │
      # │ n'efface pas.                                                                           │
      # │                                                                                         │
      # │ MECANISME. GitHub ne classe pas les releases par numero de version : le pointeur        │
      # │ suit le drapeau `make_latest`, de DEFAUT `true`. C'est la CREATION d'une release        │
      # │ qui le prend.                                                                           │
      # │                                                                                         │
      # │ ICI l'acteur est `softprops`, PAS `tauri-action`, et il DECLARE `make_latest` : on      │
      # │ le pose CALCULE a l'etape suivante, jamais laisse au defaut. Ce qu'il fait d'une        │
      # │ release EXISTANTE n'a JAMAIS ete mesure — ce workflow n'a jamais tourne (STATUT).       │
      # │                                                                                         │
      # │ STATUT (AU 2026-08-29, DATE — voir LEVEE ci-dessous) : ECRIT, NON EPROUVE. Mesure       │
      # │ anonyme du 2026-08-29 :                                                                 │
      # │   GET /repos/iakasju/iakaframe/actions/runs -> total_count: 0                           │
      # │ Ce workflow N'A JAMAIS ETE EXECUTE, pas une fois. L'unique .tgz publie (v0.20.4) a      │
      # │ pour uploader `iakasju` et date du 2026-08-05T15:24:17Z, soit DOUZE MINUTES AVANT       │
      # │ l'enregistrement de ce workflow (2026-08-05T15:36:53Z) : il a ete depose a la           │
      # │ main. Le calcul de `make_latest` ci-dessous, comme la production du tarball, n'ont      │
      # │ donc jamais tourne. CONDITION DE LEVEE : la premiere publication reelle (acte du        │
      # │ decideur), apres laquelle `actions/runs` sera non nul et l'asset portera                │
      # │ `github-actions[bot]`.                                                                  │
      # │                                                                                         │
      # │ ⚠️ LEVEE le 2026-09-02 (lot fix/R2-et-levee-absence-iakaframe) — LA CONDITION CI-DESSUS  │
      # │ EST REMPLIE, le paragraphe STATUT ci-dessus est DATE, PAS EFFACE. Mesure : le workflow   │
      # │ a tourne pour la premiere fois, run `33635520511`, `completed`/`success` ;               │
      # │ `actions/runs` -> `total_count: 1` (n'est plus 0) ; l'asset                              │
      # │ `naonedge-iakaframe-0.39.0.tgz` de v0.39.0 porte `uploader.login = github-actions[bot]`. │
      # │ CE QUI RESTE VRAI, PRECISEMENT : « ce qu'il [softprops] fait d'une release EXISTANTE     │
      # │ n'a JAMAIS ete mesure » (ligne 50-51 ci-dessus) reste EXACT — ce run a CREE v0.39.0, il  │
      # │ n'a pas EDITE une release deja existante. Seule la condition de levee ecrite ci-dessus   │
      # │ (« la premiere publication reelle ») est remplie ; celle, plus fine, sur l'EDITION       │
      # │ d'une release existante par `softprops` reste NON MESUREE.                               │
      # │                                                                                         │
      # │ LE TABLEAU DES CINQ ECRITURES — banc PRIVE iakasju/latest-contrefactuel, release        │
      # │ `id` 379113280 pour M2 et M3b. Aucun geste sur ce depot-ci.                             │
      # │   `--latest` (true) via `gh release edit` . . . AGIT           M1,  2026-09-01          │
      # │   `--latest=false` via `gh release edit` . . .  inerte         2026-08-29 (L43)         │
      # │   `make_latest=false` via `PATCH` brut . . . .  inerte         M2,  2026-09-01          │
      # │   `make_latest=legacy` via `PATCH` brut . . . . AGIT           M3b, 2026-09-01          │
      # │   `--latest=legacy` via `gh release edit` . . . INATTEIGNABLE  M3a, 2026-09-01          │
      # │ La derniere ligne n'est pas une note de bas de page : `--latest` est un drapeau         │
      # │ BOOLEEN (`strconv.ParseBool`), donc le regime `legacy` est HORS D'ATTEINTE de           │
      # │ `gh`.                                                                                   │
      # │                                                                                         │
      # │ OU SIEGE LE NO-OP : ni dans le client, ni dans le transport, ni dans la lecture.        │
      # │ M2 et M3b portent sur la MEME release, le MEME endpoint, le MEME champ, et seule        │
      # │ la VALEUR les separe — or M3b a bouge le pointeur. Il siege dans la SEMANTIQUE DE       │
      # │ LA VALEUR `false` cote API.                                                             │
      # │                                                                                         │
      # │ CE QUE FAIT LA VERIFICATION FINALE, ET CE QU'ELLE NE FAIT PAS. Elle DETECTE,            │
      # │ ROUGIT et DICTE un rattrapage — `gh release edit <plus haut> --latest`. M1              │
      # │ etablit que ce geste FONCTIONNE (le pointeur a bouge sur le banc). Ce workflow-ci,      │
      # │ LUI, ne l'execute PAS ce rattrapage : les deux applications jumelles le font             │
      # │ desormais (L44, (2b-i)). EXECUTER le rattrapage ici reste HORS PERIMETRE de ce           │
      # │ lot — c'est un acte de release, refuse a l'agent.                                        │
      # │                                                                                         │
      # ├─ FIX R-2 (lot fix/R2-et-levee-absence-iakaframe, 2026-09-02) ─────────────────────────┤
      # │ LE REFERENT ETAIT FAUX ICI AUSSI — defaut de code R-2, corrige dans les deux            │
      # │ applications jumelles (L44) mais PAS dans ce workflow-ci : ce depot n'etait pas dans    │
      # │ « Fichiers concernes » de L44. `PLUS_HAUT` derivait de la population des TAGS ; or      │
      # │ `GET /releases/latest` ne peut JAMAIS rendre qu'un tag PORTEUR D'UNE RELEASE. Sur ce    │
      # │ depot, mesure le 2026-09-02 : 9 tags de version pour 2 releases seulement (v0.20.4 et   │
      # │ v0.39.0) — PAS « 20 tags » comme une premiere lecture l'avancait, chiffre corrige a la  │
      # │ mesure. Consequence DOUBLE, comme dans les apps : (a) FAUX ROUGE — un tag de version    │
      # │ sans release faisait rougir la ligne VERIFICATION a tort ; (b) DICTEE IMPOSSIBLE — le   │
      # │ rattrapage imprime s'adressait a une release qui n'existe pas.                          │
      # │ ⚠️ CE DEFAUT N'A PAS MORDU au run reel du 2026-09-02 (v0.39.0 etait a la fois le plus   │
      # │ haut TAG et PORTEUSE d'une release) : c'est un defaut REEL, pas un incident constate.   │
      # │ Meme remede que les apps, adapte a la forme de CE workflow (PAS byte-identique : il     │
      # │ publie un tarball npm via `softprops/action-gh-release@v2`, pas des bundles Tauri ; il  │
      # │ n'y a pas de job `latest` separe post-creation, la decision est prise AVANT la creation │
      # │ de la release courante). Referent = `repos/<depot>/releases`, brouillons et             │
      # │ preversions exclus ; appel et tri SEPARES (`set -euo pipefail` + `|| true` sur le tri : │
      # │ un `grep` sans resultat ne doit pas abandonner le job avant le test « aucune release ») ;│
      # │ cas « aucune release » traite explicitement dans les DEUX etapes.                       │
      # │ EPINGLAGE — SIGNALE, NON TRAITE : ce workflow n'epingle rien (`actions/checkout@v4`,     │
      # │ `actions/setup-node@v4`, `softprops/action-gh-release@v2`, trois tags flottants). Un    │
      # │ successeur au backlog, pas ce lot.                                                       │
      # └─────────────────────────────────────────────────────────────────────────────────────────┘
      #
      # ┌─ RESIDU AU 2026-09-01, CONSERVE (le fix R-2 ne le touche pas) ────────────────────────┐
      # │ RESIDU AU 2026-09-01 : la regle de repli EXISTE, elle vit sous                          │
      # │ `make_latest=legacy`, elle n'est atteignable que par `PATCH`, et elle n'est PAS         │
      # │ dirigee par la date la plus recente (ni `created_at`, ni `published_at`, ni             │
      # │ l'ordre d'enregistrement). SA FORMULE RESTE INCONNUE : les deux releases mesurees       │
      # │ sont DU MEME JOUR, donc une regle au grain du JOUR departagee par le semver             │
      # │ produirait la meme sortie.                                                              │
      # │                                                                                         │
      # │ LA DOC DE GITHUB EST REFUTEE PAR MESURE : `GET /releases/latest` y est dit rendre       │
      # │ « the most recent non-prerelease, non-draft release, sorted by the `created_at`         │
      # │ attribute ». Le banc la refute DEUX FOIS — avant M1 et apres M3b, le pointeur           │
      # │ etait sur le `created_at` le PLUS ANCIEN. Et `created_at` est la date du COMMIT du      │
      # │ tag, pas celle de la release.                                                           │
      # │                                                                                         │
      # │ CE QUI N'EST PAS TRANSPOSE : tout cela est mesure sur un BANC PRIVE, avec un            │
      # │ acteur substitut. La transposition reste l'objet de CA-5, et CA-5 RESTE DU.             │
      # │                                                                                         │
      # │ Mesures et residu complets : specs/instructions/re-cadrage-garde-latest.md.             │
      # └─────────────────────────────────────────────────────────────────────────────────────────┘
      - name: Le tag publie est-il le plus haut semver ?
        id: rang
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          # FIX R-2 (2026-09-02) — le referent est la population des RELEASES, pas celle des TAGS :
          # `GET /releases/latest` ne peut jamais rendre qu'un tag PORTEUR D'UNE RELEASE. Le filtre
          # `^v[0-9]+\.[0-9]+\.[0-9]+$` reste : un depot peut porter des tags qui ne sont pas des
          # versions. `select(.draft|not)`/`select(.prerelease|not)` : l'endpoint `/releases/latest`
          # ignore deja les brouillons et les preversions, le referent doit ignorer EXACTEMENT les
          # memes. Appel et tri SEPARES a dessein : un echec de `gh api` doit rester un ECHEC (`set -e`
          # abandonne), et le `|| true` sur le tri seul evite qu'un `grep` sans resultat n'abandonne le
          # job AVANT le test « aucune release », qui serait sinon inatteignable.
          #
          # FIX AR-1(a) (2026-09-08, CI-RELEASE-LATEST-NON-MAITRISE) — LA COMPARAISON ETAIT MORTE.
          # Mesure aux runs reels 33959443438 (v0.40.0) et 34001818646 (v0.41.0) :
          # `make_latest=false` DEUX FOIS, alors que le tag publie ETAIT le plus haut semver. Cause :
          # cette etape tourne AVANT que `softprops` cree la release du tag courant (etape
          # suivante) — $TAG n'est donc JAMAIS dans $RELEASES, et `[ "$TAG" = "$PLUS_HAUT" ]` ne
          # peut JAMAIS etre vrai sur une publication normale. Remede : faire entrer $TAG dans la
          # POPULATION avant le tri, puis decider si le sommet de ce tri EST le tag courant. Le
          # referent (releases publiees, brouillons/preversions exclus) et le filtre semver sont
          # CONSERVES tels quels — seule la comparaison change.
          RELEASES=$(gh api "repos/${{ github.repository }}/releases" --paginate \
            --jq '.[] | select(.draft|not) | select(.prerelease|not) | .tag_name')
          POPULATION=$(printf '%s\n%s\n' "$RELEASES" "$TAG")
          PLUS_HAUT=$(printf '%s\n' "$POPULATION" \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
          echo "tag publie      : $TAG"
          echo "plus haut semver, LE TAG COURANT COMPTE dans la population : ${PLUS_HAUT:-(aucun)}"
          if [ -z "$PLUS_HAUT" ]; then
            echo "AUCUN tag de version (publie OU courant) ne matche le filtre semver -> rien a designer."
            echo "make_latest=false" >> "$GITHUB_OUTPUT"
          elif [ "$TAG" = "$PLUS_HAUT" ]; then
            echo "DECISION : $TAG EST le plus haut, UNE FOIS LUI-MEME COMPTE -> make_latest=true"
            echo "make_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "DECISION : $TAG n'est PAS le plus haut ($PLUS_HAUT) -> make_latest=false."
            echo "           Sans cette ligne, le defaut de l'API aurait VOLE le latest a $PLUS_HAUT."
            echo "make_latest=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Attacher le tarball a la release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: '*.tgz'
          # CALCULE a l'etape precedente. Ne JAMAIS remplacer par une constante : ce serait
          # reintroduire le defaut sous une autre forme.
          # Cite EN CHAINE (AR-1(a), durcissement joint) : `make_latest` est declare par
          # `softprops/action-gh-release` (cli/fixtures/actions-pin.json, mesure 2026-09-08) comme
          # acceptant les CHAINES `"true"`/`"false"`/`"legacy"`, jamais un booleen YAML natif.
          make_latest: "${{ steps.rang.outputs.make_latest }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # CA-6 — le workflow DIT ce qu'il a fait du latest, y compris quand il a decide de NE PAS le
      # poser. Un « OK » muet ne se relit pas ; et si la designation a rate, l'echec NOMME la
      # commande de rattrapage (R6). Le tarball, lui, est deja attache : rien n'est perdu.
      #
      # FIX AR-2(a) (2026-09-08, CI-RELEASE-LATEST-NON-MAITRISE) — CETTE ETAPE NE SE CONTENTE PLUS
      # DE DETECTER ET ROUGIR : mesuree deux fois de suite (runs 33959443438, 34001818646), la
      # detection dictait un rattrapage qu'Aragorn devait rejouer A LA MAIN. Geste MESURE (M1,
      # 2026-09-01, banc iakasju/latest-contrefactuel) : `gh release edit <tag> --latest` AGIT. La
      # branche du vol EXECUTE desormais ce geste au lieu de l'imprimer (AR-7 = (a) de L44, deja
      # livre a IakaCockpit/iakaFrameGUI — patron : iakaInstall/.github/workflows/release.yml:361-374),
      # PUIS RE-MESURE, et ne sort vert que si la re-mesure concorde. `gh release edit <tag>` par
      # TAG (pas par `id`) reste sur : softprops cree ici une release PUBLIEE, jamais un brouillon
      # (les reserves cli/cli#10140/#11589 portent sur les brouillons).
      - name: Verifier ce qu'est devenu le latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # FIX R-2 (2026-09-02) — meme referent que l'etape « rang » : `repos/<depot>/releases`,
          # brouillons et preversions exclus, appel et tri SEPARES. Ici la release du tag courant
          # a DEJA ete creee par l'etape precedente : elle fait partie de la population lue.
          RELEASES=$(gh api "repos/${{ github.repository }}/releases" --paginate \
            --jq '.[] | select(.draft|not) | select(.prerelease|not) | .tag_name')
          PLUS_HAUT=$(printf '%s\n' "$RELEASES" \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
          # Cas « aucune release » traite explicitement — ne peut normalement pas survenir juste
          # apres une creation, mais un `if: always()` ou un echec silencieux de l'etape precedente
          # ne doit jamais retomber sur une comparaison a la chaine vide, qui serait muette.
          if [ -z "$PLUS_HAUT" ]; then
            echo "AUCUNE release non-brouillon non-preversion trouvee — rien a verifier. Sortie en SUCCES."
            exit 0
          fi
          EFFECTIF=$(gh api "repos/${{ github.repository }}/releases/latest" --jq '.tag_name')
          echo "VERIFICATION : latest effectif = $EFFECTIF (attendu : $PLUS_HAUT)"
          if [ "$EFFECTIF" != "$PLUS_HAUT" ]; then
            echo "latest en retard : RATTRAPAGE (AR-2a) -> gh release edit $PLUS_HAUT --latest --repo ${{ github.repository }}"
            if ! gh release edit "$PLUS_HAUT" --latest --repo "${{ github.repository }}"; then
              echo "::error::le rattrapage automatique a ECHOUE (appel \`gh release edit\` en erreur)."
              echo "::error::RATTRAPAGE MANUEL : gh release edit $PLUS_HAUT --latest --repo ${{ github.repository }}"
              exit 1
            fi
            EFFECTIF=$(gh api "repos/${{ github.repository }}/releases/latest" --jq '.tag_name')
            echo "RE-VERIFICATION : latest effectif = $EFFECTIF (attendu : $PLUS_HAUT)"
            if [ "$EFFECTIF" != "$PLUS_HAUT" ]; then
              echo "::error::le latest effectif ($EFFECTIF) n'est pas le plus haut semver ($PLUS_HAUT) apres rattrapage."
              echo "::error::RATTRAPAGE MANUEL : gh release edit $PLUS_HAUT --latest --repo ${{ github.repository }}"
              exit 1
            fi
          fi
          echo "latest maitrise : $PLUS_HAUT"
