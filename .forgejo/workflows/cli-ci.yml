name: cli-ci
# CI de la CLI @naonedge/iakaframe : tests sur Windows / macOS / Linux (Node 20).
# Necessite des runners Forgejo Actions etiquetes en consequence ; a defaut, le job
# ubuntu suffit (les autres restent en attente d'un runner adapte).
# Les tests de cli/ lisent aussi library/ (goldens de parite, cas de la skill appflowy-doc
# cables via cli/test/appflowy-doc-skill.test.js) : library/** doit donc declencher la CI,
# sinon une regression de skill passe au vert faute d'execution.
on:
  push:
    paths:
      - 'cli/**'
      - 'library/**'
      - '.forgejo/workflows/cli-ci.yml'
  pull_request:
    paths:
      - 'cli/**'
      - 'library/**'

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Version & aide
        run: |
          node src/index.js --version
          node src/index.js --help
      - name: Tests
        run: node --test
